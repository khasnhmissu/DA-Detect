MODEL:
  OUTPUT_DIR: ./output
  OUTPUT_SAVE_NAME: triplet_fpn
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHT: "catalog://ImageNetPretrained/MSRA/R-50"
  DOMAIN_ADAPTATION_ON: True
  BACKBONE:
    CONV_BODY: "R-50-FPN"
    OUT_CHANNELS: 1024
  RPN:
    USE_FPN: True
    ANCHOR_STRIDE: (4, 8, 16, 32, 64)
    ANCHOR_SIZES: (32, 64, 128, 256, 512)
    # Voi triplet IMS_PER_BATCH=4 (effective batch 12), bump TOP_N len de
    # tat ca 12 image deu co proposal sau NMS.
    PRE_NMS_TOP_N_TRAIN: 6000
    PRE_NMS_TOP_N_TEST: 1000
    POST_NMS_TOP_N_TRAIN: 6000
    POST_NMS_TOP_N_TEST: 1000
    FPN_POST_NMS_TOP_N_TRAIN: 6000
    FPN_POST_NMS_TOP_N_TEST: 1000
  ROI_HEADS:
    USE_FPN: True
    BATCH_SIZE_PER_IMAGE: 512
    NMS: 0.3
  ROI_BOX_HEAD:
    NUM_CLASSES: 3
    POOLER_RESOLUTION: 7
    POOLER_SCALES: (0.25, 0.125, 0.0625, 0.03125)
    POOLER_SAMPLING_RATIO: 2
    FEATURE_EXTRACTOR: "FPN2MLPFeatureExtractor"
    PREDICTOR: "FPNPredictor"
  DA_HEADS:
    DA_IMG_GRL_WEIGHT: 0.1
    DA_INS_GRL_WEIGHT: 0.1
    DA_IMG_advGRL_WEIGHT: 0.1
    DA_INS_advGRL_WEIGHT: 0.1
    DA_IMG_LOSS_WEIGHT: 1.0
    DA_INS_LOSS_WEIGHT: 1.0
    DA_CST_LOSS_WEIGHT: 0.0
    DA_TRIPLET_INS_WEIGHT: 0.0
    DA_TRIPLET_IMG_WEIGHT: 1.0
    DA_ADV_GRL_THRESHOLD: 30
    TRIPLET_USE: True
    ALIGNMENT: False
    DA_ADV_GRL: True
    TRIPLET_MAX_MARGIN: 1.0
    TRIPLET_MARGIN_INS: 1.0
    TRIPLET_MARGIN_IMG: 1.0
DATALOADER:
  SIZE_DIVISIBILITY: 32
  NUM_WORKERS: 2
DATASETS:
  TRAIN:                 ("fusionda_source_train_cocostyle",)
  SOURCE_TRAIN:          ("fusionda_source_train_cocostyle",)
  TARGET_TRAIN:          ("fusionda_target_train_cocostyle",)
  TARGET_TRAIN_negative: ("fusionda_rainy_train_cocostyle",)
  TEST:                  ("fusionda_target_test_cocostyle",)
INPUT:
  MIN_SIZE_TRAIN: (512,)
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 512
  MAX_SIZE_TEST: 1024
SOLVER:
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0005
  STEPS: (16800, 22400)         # bi bo qua boi CosineLR cua train_net_triplet.py, giu cho consistency
  MAX_ITER: 28000               # 40 epoch (2800 anh / batch 4 = 700 iter/epoch)
  IMS_PER_BATCH: 4              # effective batch 12 vi triplet forward 3 domain (src+tgt+tgt_neg)
  CHECKPOINT_PERIOD: 7000       # luu ckpt moi 10 epoch (7k/14k/21k/28k)
  WARMUP_ITERS: 700             # 1 epoch warmup truoc khi cosine annealing
  WARMUP_LR: 0.0001
  LR_MIN: 0.000001
TEST:
  IMS_PER_BATCH: 1
