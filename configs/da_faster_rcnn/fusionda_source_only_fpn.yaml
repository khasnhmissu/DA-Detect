MODEL:
  OUTPUT_DIR: ./output
  OUTPUT_SAVE_NAME: source_only_fpn
  META_ARCHITECTURE: "GeneralizedRCNN"
  WEIGHT: "catalog://ImageNetPretrained/MSRA/R-50"
  DOMAIN_ADAPTATION_ON: False
  BACKBONE:
    CONV_BODY: "R-50-FPN"
    OUT_CHANNELS: 1024
  RPN:
    USE_FPN: True
    ANCHOR_STRIDE: (4, 8, 16, 32, 64)
    ANCHOR_SIZES: (32, 64, 128, 256, 512)
    PRE_NMS_TOP_N_TRAIN: 2000
    PRE_NMS_TOP_N_TEST: 1000
    POST_NMS_TOP_N_TRAIN: 2000
    POST_NMS_TOP_N_TEST: 1000
    FPN_POST_NMS_TOP_N_TRAIN: 2000
    FPN_POST_NMS_TOP_N_TEST: 1000
  ROI_HEADS:
    USE_FPN: True
    BATCH_SIZE_PER_IMAGE: 512
    NMS: 0.3
  ROI_BOX_HEAD:
    NUM_CLASSES: 3
    POOLER_RESOLUTION: 7
    POOLER_SCALES: (0.25, 0.125, 0.0625, 0.03125)
    POOLER_SAMPLING_RATIO: 2
    FEATURE_EXTRACTOR: "FPN2MLPFeatureExtractor"
    PREDICTOR: "FPNPredictor"
DATALOADER:
  SIZE_DIVISIBILITY: 32
  NUM_WORKERS: 2
DATASETS:
  TRAIN: ("fusionda_source_train_cocostyle",)
  TEST:  ("fusionda_target_test_cocostyle",)
INPUT:
  MIN_SIZE_TRAIN: (320,)
  MAX_SIZE_TRAIN: 640
  MIN_SIZE_TEST: 320
  MAX_SIZE_TEST: 640
SOLVER:
  BASE_LR: 0.001
  WEIGHT_DECAY: 0.0005
  STEPS: (17000, 23000)         # decay ~60% va ~80% cua MAX_ITER
  MAX_ITER: 28000               # 40 epoch (2800 anh / batch 4 = 700 iter/epoch)
  IMS_PER_BATCH: 4
  CHECKPOINT_PERIOD: 7000       # luu ckpt o iter 7k/14k/21k/28k
  WARMUP_ITERS: 1500
  WARMUP_LR: 0.0001
  LR_MIN: 0.000001
TEST:
  IMS_PER_BATCH: 1
